<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0918">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tic-Tac-Toe Neon</title>
<style>
:root{
  /* Цвет: тёмная индиго-база, два неоновых цвета игроков */
  --bg:#0A0918;
  --surface:#141230;
  --surface-2:#1C1A40;
  --surface-3:#28255C;
  --line:rgba(160,150,255,.10);
  --text:#EEEBFF;
  --text-2:#9591C4;
  --x:#2EE8FF;           /* игрок, главное действие */
  --x-glow:rgba(46,232,255,.45);
  --o:#FF4FD8;           /* ИИ */
  --o-glow:rgba(255,79,216,.45);
  --on-accent:#041219;

  /* Сетка 4 px */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;

  /* Типографика */
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;

  /* переопределяются из gemBridge.init(), если игра открыта внутри Gem Space */
  --gem-safe-top:0px;
  --gem-safe-bottom:0px;

  /* Форма */
  --r-s:12px;--r-m:16px;--r-l:22px;--r-pill:999px;

  /* Движение */
  --fast:120ms;--base:220ms;--slow:360ms;
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;height:100%;overflow:hidden;color:var(--text);font:400 17px/1.45 var(--f);
  background:
    radial-gradient(120% 70% at 50% -10%,#221B5E 0%,rgba(34,27,94,0) 60%),
    radial-gradient(80% 50% at 50% 110%,#2A0F4A 0%,rgba(42,15,74,0) 70%),
    var(--bg);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--x);outline-offset:2px}
#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  padding:max(var(--s4),env(safe-area-inset-top),var(--gem-safe-top)) var(--s4)
          max(var(--s5),env(safe-area-inset-bottom),var(--gem-safe-bottom));
}
.screen{display:flex;flex-direction:column;gap:var(--s5);flex:1 1 auto;min-height:0}
/* Меню: середина прокручивается, кнопка «Играть» закреплена внизу.
   Так низ интерфейса виден на любом экране, сколько бы места ни съела
   шапка хоста (на Android Gem Space отдаёт крупный верхний отступ). */
#menu{gap:var(--s3);min-height:0}
.menu-scroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:var(--s3);
  /* подсказка, что ниже есть ещё содержимое */
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 14px),transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 14px),transparent 100%);
}
.menu-scroll::-webkit-scrollbar{width:0;height:0}
/* Низкий экран: ужимаем то, что не влияет на попадание пальцем.
   Кнопки остаются не меньше 44 px. */
body.h-short #menu,body.h-short .menu-scroll{gap:var(--s2)}
body.h-short h1.logo svg{width:64px;height:64px;margin:-11px}
body.h-short .rank,body.h-short .daily{padding:var(--s2) var(--s4)}
body.h-short .seg button{min-height:46px}
body.h-short .btn-primary{min-height:52px}
body.h-xshort h1.logo{display:none}
body.h-xshort .seg button{min-height:44px}
body.h-xshort .stepper{grid-template-columns:44px 1fr 44px}
body.h-xshort .stepper button{height:44px}
body.h-xshort .play-area{gap:var(--s2)}
body.h-xshort .btn-primary{min-height:50px}
.screen[hidden]{display:none}
.caption{font:500 13px/1.35 var(--f);color:var(--text-2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Меню ---------- */
.brand{text-align:center}
h1.logo{margin:0 0 var(--s1);display:flex;justify-content:center;gap:var(--s4)}
h1.logo svg{width:79px;height:79px;margin:-13px}
h1.logo .mark.draw circle{animation-delay:260ms}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rank{background:var(--surface);border-radius:var(--r-m);padding:var(--s3) var(--s4);display:grid;gap:var(--s2)}
.rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.rank-name{font:600 17px/1.3 var(--f)}
.bar{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:left;background:var(--x);
  box-shadow:0 0 12px var(--x-glow);transition:transform var(--slow) var(--ease)}
.group{display:grid;gap:var(--s2)}
.group[hidden]{display:none}
.seg{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--s1);
  background:var(--surface);padding:var(--s1);border-radius:var(--r-m)}
.seg button{min-height:44px;border-radius:var(--r-s);color:var(--text-2);font-weight:600;
  display:grid;place-content:center;gap:2px;transition:background var(--fast) var(--ease),transform var(--fast) var(--ease)}
.seg button small{font:500 13px/1 var(--f);color:var(--text-2);opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);
  box-shadow:inset 0 0 0 1px rgba(46,232,255,.4),0 0 18px rgba(46,232,255,.16)}
.seg button[aria-pressed="true"] small{color:var(--x);opacity:1}
.seg button:active{transform:scale(.96)}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:var(--s1);
  background:var(--surface);padding:var(--s1);border-radius:var(--r-m)}
.stepper button{height:44px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--text);
  transition:background var(--fast) var(--ease),transform var(--fast) var(--ease)}
.stepper button:active{transform:scale(.94);background:var(--surface-2)}
.stepper button:disabled{opacity:.25;cursor:default}
.stepper button svg{width:22px;height:22px}
.lvl{text-align:center;display:grid;gap:var(--s2);justify-items:center}
.lvl b{font:600 17px/1.2 var(--f)}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--surface-3);transition:background var(--base) var(--ease),box-shadow var(--base)}
.dots i.on{background:var(--x);box-shadow:0 0 8px var(--x-glow)}
.dots.legend i.on{background:var(--o);box-shadow:0 0 8px var(--o-glow)}
.desc{margin:0}
/* описание режима держим в одну строку */
#modeDesc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-area{position:relative;margin-top:auto;display:grid;gap:var(--s3);text-align:center}
#statsLine{padding:0 52px;min-height:44px;display:grid;place-items:center}
.menu-sound{position:absolute;right:0;bottom:0}
.menu-lang{position:absolute;left:0;bottom:0;font:700 13px/1 var(--f);letter-spacing:.04em;color:var(--x);
  text-shadow:0 0 8px var(--x-glow);box-shadow:inset 0 0 0 1px rgba(46,232,255,.35),0 0 14px rgba(46,232,255,.18)}
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#rain[hidden]{display:none}
#app{position:relative;z-index:1}
.btn{min-height:56px;padding:0 var(--s6);border-radius:var(--r-pill);font-weight:700;
  transition:transform var(--fast) var(--ease),filter var(--fast)}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--x);color:var(--on-accent);box-shadow:0 0 28px var(--x-glow),inset 0 -2px 0 rgba(0,0,0,.15)}
.btn-secondary{background:var(--surface-2);color:var(--text)}
.btn-quiet{min-height:44px;color:var(--text-2);font-weight:600}

/* ---------- Игра ---------- */
.topbar{display:flex;align-items:center;gap:var(--s2)}
.icon-btn{width:44px;height:44px;border-radius:var(--r-s);background:var(--surface);display:grid;place-items:center;
  color:var(--text);transition:transform var(--fast) var(--ease),background var(--fast)}
.icon-btn:active{transform:scale(.92);background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.topbar .title{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.players{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.pcard{position:relative;background:var(--surface);border-radius:var(--r-m);padding:var(--s3);
  display:flex;align-items:center;gap:var(--s3);min-width:0}
.pcard::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;pointer-events:none;
  transition:opacity var(--base) var(--ease)}
.pcard.you::after{box-shadow:inset 0 0 0 1.5px var(--x),0 0 22px rgba(46,232,255,.22)}
.pcard.ai::after{box-shadow:inset 0 0 0 1.5px var(--o),0 0 22px rgba(255,79,216,.22)}
.pcard.active::after{opacity:1}
.pcard svg{width:26px;height:26px;flex:none;margin-left:var(--s1)}
.pcard .who{font:600 17px/1.2 var(--f)}
.pcard{gap:var(--s2)}
.pcard > div{min-width:0}
.pcard .caption{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{text-align:center;min-height:25px;color:var(--text-2);font-weight:500;transition:color var(--base)}
.status.you{color:var(--x)}
.status.ai{color:var(--o)}
.board-stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
/* Низкий экран: отдаём полю всё, что можно, не трогая размеры кнопок */
body.h-short #game{gap:var(--s3)}
body.h-short .pcard{padding:var(--s2) var(--s3)}
body.h-short .pcard svg{width:22px;height:22px}
body.h-short .status{min-height:22px}
body.h-xshort #game{gap:var(--s2)}
body.h-xshort .hint{display:none}
body.h-xshort .pcard .caption{display:none}
.board-wrap{
  /* сторону задаёт JS (fitBoard): только так поле остаётся строго квадратным
     при любой высоте экрана и любом отступе хоста */
  --bs:min(calc(100vw - 32px),448px);
  position:relative;flex:0 0 auto;width:var(--bs);height:var(--bs);margin:0 auto;padding:var(--gap);
  background:var(--surface);border-radius:var(--r-l);
  box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.45),0 0 48px rgba(110,80,255,.14);
}
#board{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:var(--gap);width:100%;height:100%}
.cell{position:relative;border-radius:var(--cr);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);
  display:grid;place-items:center;
  transition:transform var(--fast) var(--ease),background var(--fast),opacity var(--base),box-shadow var(--base) var(--ease)}
/* Занятая клетка светится цветом своего знака, как плитки на иконке */
.cell.x{box-shadow:inset 0 0 0 1.5px var(--x),inset 0 0 22px rgba(46,232,255,.16),0 0 20px var(--x-glow)}
.cell.o{box-shadow:inset 0 0 0 1.5px var(--o),inset 0 0 22px rgba(255,79,216,.16),0 0 20px var(--o-glow)}
.cell.old{box-shadow:inset 0 0 0 1px var(--line)}
.cell:active{transform:scale(.95)}
@media (hover:hover){.cell:not(.x):not(.o):hover{background:var(--surface-3)}}
.cell.x{color:var(--x)}
.cell.o{color:var(--o)}
.cell.win{box-shadow:inset 0 0 0 2px currentColor,inset 0 0 26px rgba(255,255,255,.08),0 0 34px currentColor}
.mark{width:74%;height:74%;overflow:visible;filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 10px currentColor);
  transition:opacity var(--base) var(--ease),transform var(--base) var(--ease)}
.mark path,.mark circle{fill:none;stroke:currentColor;stroke-width:11;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:0}
.mark circle{transform:rotate(-90deg);transform-origin:50px 50px}
.mark.draw path,.mark.draw circle{animation:draw 200ms var(--ease) both}
.mark.draw path.d2{animation-delay:90ms}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.cell.old .mark{opacity:.32;transform:scale(.86)}
.cell.gone .mark{opacity:0;transform:scale(.5);transition-duration:var(--base)}
.cell.win{animation:pop var(--slow) var(--spring)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
.board-wrap.ended .cell:not(.win){opacity:.45}
.cell.shake{animation:shake 240ms var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#winline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#winline line{stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:0;opacity:0}
#winline line.show{opacity:1}
#winline line.draw{animation:draw 420ms var(--ease) both}
#winline line.x{stroke:var(--x);filter:drop-shadow(0 0 6px var(--x)) drop-shadow(0 0 16px var(--x))}
#winline line.o{stroke:var(--o);filter:drop-shadow(0 0 6px var(--o)) drop-shadow(0 0 16px var(--o))}
.hint{text-align:center;margin:0}
.undo-row{display:grid;place-items:center;min-height:44px}
#undoBtn{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);
  border-radius:var(--r-pill);background:var(--surface);color:var(--text-2);font:600 15px/1 var(--f);
  transition:transform var(--fast) var(--ease),background var(--fast),color var(--fast)}
#undoBtn:active{transform:scale(.95);background:var(--surface-2)}
#undoBtn[hidden]{display:none}
#undoBtn svg{width:18px;height:18px}
/* Ежедневная задача */
.daily{display:flex;align-items:center;gap:var(--s3);background:var(--surface);border-radius:var(--r-m);
  padding:var(--s3) var(--s4);text-align:left;width:100%;
  transition:transform var(--fast) var(--ease),background var(--fast)}
.daily:active{transform:scale(.98);background:var(--surface-2)}
.daily > div{flex:1;min-width:0}
.daily .dt{font:600 15px/1.3 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daily .caption{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daily .badge{flex:none;width:36px;height:36px;border-radius:var(--r-pill);display:grid;place-items:center;
  background:var(--surface-2);color:var(--x);box-shadow:0 0 16px rgba(46,232,255,.18)}
.daily .badge svg{width:20px;height:20px}
.daily.done{opacity:.65}
.daily.done .badge{color:var(--text-2);box-shadow:none}

/* ---------- Оверлеи ---------- */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:var(--s5);
  background:rgba(6,5,16,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity var(--base) var(--ease),visibility 0s linear var(--base)}
.overlay.show{opacity:1;visibility:visible;transition:opacity var(--base) var(--ease),visibility 0s}
.sheet{width:min(100%,400px);background:var(--surface);border-radius:var(--r-l);padding:var(--s6) var(--s5) var(--s5);
  text-align:center;display:grid;gap:var(--s2);box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.5);
  transform:translateY(12px) scale(.98);transition:transform var(--slow) var(--spring)}
.overlay.show .sheet{transform:none}
.sheet h2{margin:0;font:800 34px/1.1 var(--f);letter-spacing:-.02em}
.sheet h2.win{color:var(--x);text-shadow:0 0 20px var(--x-glow)}
.sheet h2.lose{color:var(--o);text-shadow:0 0 20px var(--o-glow)}
.sheet p{margin:0}
.sheet p:empty{display:none}
.reward{margin:var(--s4) 0 var(--s1);font:800 34px/1 var(--f);color:var(--x);text-shadow:0 0 16px var(--x-glow)}
.reward.zero{color:var(--text-2);text-shadow:none}
.sheet .actions{display:grid;gap:var(--s2);margin-top:var(--s5)}
.news{color:var(--x);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="app">

  <!-- ===== МЕНЮ ===== -->
  <section id="menu" class="screen">
    <div class="menu-scroll">
    <header class="brand">
      <h1 class="logo">
        <span class="sr" data-i18n="logo">Крестики-нолики</span>
        <svg viewBox="-26 -26 152 152" class="mark draw" style="color:var(--x)" aria-hidden="true"><path pathLength="1" d="M28 28 L72 72"/><path class="d2" pathLength="1" d="M72 28 L28 72"/></svg>
        <svg viewBox="-26 -26 152 152" class="mark draw" style="color:var(--o)" aria-hidden="true"><circle pathLength="1" cx="50" cy="50" r="24"/></svg>
      </h1>
    </header>

    <div class="rank">
      <div class="rank-top">
        <span class="rank-name" id="rankName">Новичок</span>
        <span class="caption num" id="rankScore"></span>
      </div>
      <div class="bar"><i id="rankBar"></i></div>
    </div>

    <button class="daily" id="dailyCard">
      <span class="badge" id="dailyBadge" aria-hidden="true"></span>
      <div>
        <div class="dt" id="dailyTitle"></div>
        <div class="caption" id="dailyNote"></div>
      </div>
    </button>

    <div class="group">
      <span class="caption" data-i18n="opponent">Соперник</span>
      <div class="seg" style="--cols:2" id="oppSeg">
        <button data-opp="ai" data-i18n="oppAi">Компьютер</button>
        <button data-opp="friend" data-i18n="oppFriend">Друг рядом</button>
      </div>
    </div>

    <div class="group">
      <span class="caption" data-i18n="mode">Режим</span>
      <div class="seg" style="--cols:2" id="modeSeg">
        <button data-mode="classic" data-i18n="mode_classic">Классика</button>
        <button data-mode="vanish" data-i18n="mode_vanish">Исчезновение</button>
      </div>
      <p class="caption desc" id="modeDesc"></p>
    </div>

    <div class="group">
      <span class="caption" data-i18n="board">Поле</span>
      <div class="seg" style="--cols:3" id="sizeSeg">
        <button data-size="3">3×3<small>×1</small></button>
        <button data-size="4">4×4<small>×1,6</small></button>
        <button data-size="5">5×5<small>×2,2</small></button>
      </div>
    </div>

    <div class="group" id="lvlGroup">
      <span class="caption" data-i18n="difficulty">Сложность</span>
      <div class="stepper">
        <button id="lvlPrev" data-i18n-aria="easier" aria-label="Легче"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="lvl"><b id="lvlName">Лёгкий</b><div class="dots" id="lvlDots"><i></i><i></i><i></i><i></i><i></i></div></div>
        <button id="lvlNext" data-i18n-aria="harder" aria-label="Сложнее"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <p class="caption desc" id="lvlDesc"></p>
    </div>

    </div>

    <div class="play-area">
      <span class="caption num" id="rewardPreview"></span>
      <button class="btn btn-primary" id="playBtn" data-i18n="play">Играть</button>
      <span class="caption num" id="statsLine"></span>
      <button class="icon-btn menu-lang" id="langBtn" aria-label="Language">RU</button>
      <button class="icon-btn menu-sound sound-toggle" id="menuSoundBtn" aria-label="Звук"></button>
    </div>
  </section>

  <!-- ===== ИГРА ===== -->
  <section id="game" class="screen" hidden>
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" data-i18n-aria="toMenu" aria-label="В меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="title caption" id="gameTitle"></span>
      <button class="icon-btn sound-toggle" id="soundBtn" aria-label="Звук"></button>
      <button class="icon-btn" id="pauseBtn" data-i18n-aria="pauseAria" aria-label="Пауза"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    </div>

    <div class="players">
      <div class="pcard you" id="pYou">

/* =====================================================================
   Мост с Gem Space. Без вызова app.ready() платформа считает мини-апп
   незагрузившимся и показывает «Невозможно подключиться к серверу».
   SDK грузим из кода с жёстким таймаутом: тег <script src> задержал бы
   запуск игры, пока не ответит сеть.
   ===================================================================== */
function loadScript(src, timeoutMs) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (ok) => { if (!done) { done = true; resolve(ok); } };
    try {
      const el = document.createElement('script');
      el.src = src;
      el.onload = () => finish(true);
      el.onerror = () => finish(false);
      document.head.appendChild(el);
      setTimeout(() => finish(false), timeoutMs);
    } catch (e) { finish(false); }
  });
}
// хост может быть подключён, но молчать — игра не должна зависать
function withTimeout(promise, ms, fallback) {
  return new Promise((resolve) => {
    let settled = false;
    const timer = setTimeout(() => { if (!settled) { settled = true; resolve(fallback); } }, ms);
    Promise.resolve(promise).then(
      (v) => { if (!settled) { settled = true; clearTimeout(timer); resolve(v); } },
      () => { if (!settled) { settled = true; clearTimeout(timer); resolve(fallback); } }
    );
  });
}
// безопасные зоны от Gem Space поверх стандартных env()
function applyGemViewport(initData) {
  const vp = initData && initData.viewport;
  if (!vp) return;
  const root = document.documentElement.style;
  if (typeof vp.safeAreaTop === 'number') root.setProperty('--gem-safe-top', vp.safeAreaTop + 'px');
  if (typeof vp.safeAreaBottom === 'number') root.setProperty('--gem-safe-bottom', vp.safeAreaBottom + 'px');
}
const gemBridge = {
  available: false,
  bridge: null,
  async init() {
    // если хост положил мост на страницу нативно — сеть не нужна вовсе
    if (typeof GemSpaceBridge === 'undefined' || !GemSpaceBridge.bridge) {
      const loaded = await loadScript(
        'https://cdn.jsdelivr.net/npm/@gemspace/gem-bridge-sdk/index.global.js', 1500
      );
      if (!loaded || typeof GemSpaceBridge === 'undefined' || !GemSpaceBridge.bridge) return;
    }
    this.bridge = GemSpaceBridge.bridge;
    const initData = await withTimeout(this.bridge.app.init(), 1500, null);
    if (initData) {
      this.available = true;
      applyGemViewport(initData);
    }
  },
  async ready() {
    if (!this.available) return;
    await withTimeout(this.bridge.app.ready(), 1500, null);
  },
};

const Store = {
  async load() {
    let raw = null;
    try {
      if (gemBridge.available) {
        const r = await gemBridge.bridge.storage.get({ key: SAVE_KEY });
        if (r && r.value) raw = r.value;
      } else if (window.storage && typeof window.storage.get === 'function') {
        const r = await window.storage.get(SAVE_KEY);
        if (r && r.value) raw = r.value;
      }
    } catch (e) { raw = null; }
    if (!raw) {
      try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
    }
    if (!raw) return null;
    // часть реализаций отдаёт готовый объект вместо строки
    if (typeof raw === 'object') return raw;
    try { return JSON.parse(raw); } catch (e) { return null; }
  },
  ready: false, // до загрузки сейва ничего не пишем, иначе затрём прогресс
  save(data) {
    if (!this.ready) return;
    const s = JSON.stringify(data);
    try {
      if (gemBridge.available) { gemBridge.bridge.storage.set({ key: SAVE_KEY, value: s }); return; }
      if (window.storage && typeof window.storage.set === 'function') {
        window.storage.set(SAVE_KEY, s).catch(() => {});
        return;
      }
    } catch (e) { /* падаем на localStorage */ }
    try { localStorage.setItem(SAVE_KEY, s); } catch (e) { /* только память */ }
  },
};

function sanitize(d) {
  const base = defaults();
  if (!d || typeof d !== 'object') return base;
  const out = Object.assign(base, d);

  if (!CONFIG.modes[out.settings.mode]) out.settings.mode = 'classic';
  if (!CONFIG.sizes[out.settings.size]) out.settings.size = 3;
  const lv = Number(out.settings.level);
  out.settings.level = Number.isInteger(lv) && lv >= 0 && lv < CONFIG.levels.length ? lv : 1;
  if (out.settings.opponent !== 'friend') out.settings.opponent = 'ai';
  out.score = Math.max(0, Number(out.score) || 0);
  out.streak = Math.max(0, Number(out.streak) || 0);
  out.bestStreak = Math.max(0, Number(out.bestStreak) || 0);
  if (!out.stats || typeof out.stats !== 'object') out.stats = {};
  if (!out.daily || typeof out.daily !== 'object') out.daily = { date: '', done: false };
  out.daily.date = typeof out.daily.date === 'string' ? out.daily.date : '';
  out.daily.done = out.daily.done === true;
  out.sound = out.sound !== false;
  out.lang = I18N[out.lang] ? out.lang : detectLang();
  return out;
}

const Sound = (() => {

  function tone(freq, dur, type, vol, when, slide) {

      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || .07, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) { /* звук не обязателен */ }
  }
  return {
    unlock() { ensure(); },
    tap()    { tone(540, .05, 'triangle', .04); },
    x()      { tone(820, .12, 'sine', .08, 0, 1.3); },
    o()      { tone(420, .14, 'sine', .08, 0, .8); },
    vanish() { tone(300, .2, 'sine', .035, .05, .5); },
    bad()    { tone(160, .1, 'square', .03); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, .24, 'triangle', .07, i * .09)); },
    lose()   { [392, 330, 262].forEach((f, i) => tone(f, .28, 'sine', .07, i * .12)); },
    draw()   { tone(440, .16, 'triangle', .05); tone(440, .16, 'triangle', .05, .16); },
  };
})();

/* =====================================================================
   Фон: падающие крестики и нолики (меню и партия) (Canvas, пул частиц)
   ===================================================================== */
const Rain = (() => {
  const cv = document.getElementById('rain');
  const ctx = cv.getContext('2d');
  const R = CONFIG.menuRain;
  const reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const COL = { 1: '#2EE8FF', 2: '#FF4FD8' };
  const pool = [];
  let W = 0, H = 0, dpr = 1, running = false, raf = 0, last = 0, seeded = false;
  let level = 1, target = 1;

  const rnd = (a, b) => a + Math.random() * (b - a);
  function reset(p, anywhere) {
    p.type = Math.random() < 0.5 ? 1 : 2;
    p.size = rnd(R.sizeMin, R.sizeMax);
    p.x = rnd(0, W);
    p.y = anywhere ? rnd(-p.size, H) : -p.size - rnd(0, H * 0.3);
    // крупные падают быстрее — даёт ощущение глубины
    const k = (p.size - R.sizeMin) / Math.max(1, R.sizeMax - R.sizeMin);
    p.vy = R.speedMin + (R.speedMax - R.speedMin) * (0.4 * Math.random() + 0.6 * k);
    p.rot = rnd(0, Math.PI * 2);
    p.spin = rnd(-R.spinMax, R.spinMax);
    p.alpha = R.alphaMin + (R.alphaMax - R.alphaMin) * (0.3 + 0.7 * k);
    p.drift = rnd(0, Math.PI * 2);
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function seed() {
    pool.length = 0;
    for (let i = 0; i < R.count; i++) { const p = {}; reset(p, true); pool.push(p); }
    seeded = true;
  }
  function drawMark(p) {
    const s = p.size / 2;
    ctx.save();
    ctx.translate(p.x + Math.sin(p.drift) * 6, p.y);
    ctx.rotate(p.rot);
    // плавное появление сверху и затухание внизу
    const fade = Math.min(1, (p.y + p.size) / (H * 0.15), (H - p.y) / (H * 0.25));
    ctx.globalAlpha = p.alpha * level * Math.max(0, fade);
    ctx.strokeStyle = COL[p.type];
    ctx.shadowColor = COL[p.type];
    ctx.shadowBlur = p.size * 0.5;
    ctx.lineWidth = Math.max(2, p.size * 0.14);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (p.type === 1) {
      const a = s * 0.62;
      ctx.moveTo(-a, -a); ctx.lineTo(a, a);
      ctx.moveTo(a, -a); ctx.lineTo(-a, a);
    } else {
      ctx.arc(0, 0, s * 0.62, 0, Math.PI * 2);
    }
    ctx.stroke();
    ctx.restore();
  }
  function frame(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    level += (target - level) * Math.min(1, dt * 3); // плавная смена яркости
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < pool.length; i++) {
      const p = pool[i];
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
      p.drift += dt * 0.8;
      if (p.y - p.size > H) reset(p, false);
      drawMark(p);
    }
    raf = requestAnimationFrame(frame);
  }
  function toggle(on) {
    const want = on && !(reduce && reduce.matches);
    cv.hidden = !on;
    if (want === running) return;
    running = want;
    if (running) {
      resize();
      if (!seeded) seed();
      last = performance.now();
      raf = requestAnimationFrame(frame);
    } else {
      cancelAnimationFrame(raf);
      ctx.clearRect(0, 0, W, H);
    }
  }
  window.addEventListener('resize', () => {
    if (!running) return;
    const oldW = W, oldH = H;
    resize();
    for (const p of pool) { p.x *= W / (oldW || W); p.y *= H / (oldH || H); }
  });
  function setLevel(v) { target = v; }
  return { toggle, setLevel };
})();

/* =====================================================================
   Задача дня: одинаковая для всех, выводится из даты — без сервера
   ===================================================================== */
const Daily = (() => {
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  // задача дня: размер поля, режим и уровень выводятся из даты
  function task() {
    const date = today(), h = hash(date);
    const size = [3, 4, 5][h % 3];
    const mode = (h >> 3) % 2 ? 'vanish' : 'classic';
    const level = 1 + ((h >> 6) % (CONFIG.levels.length - 1)); // от Среднего и выше
    return { date, size, mode, level };
  }
  function sync() {
    const cur = task();
    if (save.daily.date !== cur.date) { save.daily = { date: cur.date, done: false }; Store.save(save); }
    return cur;
  }
  function text(task) {
    return t('dailyTask', { s: task.size, mode: modeName(task.mode), level: levelName(task.level) });
  }
  function matches(dt) {
    const s = save.settings;
    return s.opponent === 'ai' && s.size === dt.size && s.mode === dt.mode && s.level === dt.level;
  }
  return { sync, text, matches, task };
})();

/* =====================================================================
   Модель поля
   ===================================================================== */
let N = 3, L = 3, KEEP = 3, VANISH = false, LEVEL = CONFIG.levels[0];
let cells = new Int8Array(9);
const queues = [null, [], []];   // порядок постановки знаков каждого игрока
let lines = [], cellLines = [], neigh = [], centerSet = new Set();
let moveCount = 0, turn = P, starter = P;

function setupGeometry(n) {
  N = n; L = CONFIG.sizes[n].win; KEEP = CONFIG.sizes[n].keep;
  cells = new Int8Array(n * n);
  lines = []; cellLines = []; neigh = [];
  for (let i = 0; i < n * n; i++) { cellLines.push([]); neigh.push([]); }
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    for (const [dr, dc] of dirs) {
      const er = r + dr * (L - 1), ec = c + dc * (L - 1);
      if (er < 0 || er >= n || ec < 0 || ec >= n) continue;
      const ln = [];
      for (let k = 0; k < L; k++) ln.push((r + dr * k) * n + (c + dc * k));
      const id = lines.length;
      lines.push(ln);
      for (const i of ln) cellLines[i].push(id);
    }
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < n && cc >= 0 && cc < n) neigh[r * n + c].push(rr * n + cc);
    }
  }
  centerSet = new Set();
  const lo = n === 5 ? 1 : n === 4 ? 1 : 0, hi = n === 5 ? 3 : n === 4 ? 2 : n - 1;
  for (let r = lo; r <= hi; r++) for (let c = lo; c <= hi; c++) centerSet.add(r * n + c);
}

// Ход: в исчезновении при полном запасе сначала стирается самый старый знак
function apply(i, p) {
  let rem = -1;
  if (VANISH && queues[p].length >= KEEP) {
    rem = queues[p].shift();
    cells[rem] = 0;
  }
  cells[i] = p;
  queues[p].push(i);
  return rem;
}
function undo(i, p, rem) {
  cells[i] = 0;
  queues[p].pop();
  if (rem >= 0) { cells[rem] = p; queues[p].unshift(rem); }
}
function winAt(i, p) {
  const ls = cellLines[i];
  for (let k = 0; k < ls.length; k++) {
    const ln = lines[ls[k]];
    let ok = true;
    for (let j = 0; j < ln.length; j++) if (cells[ln[j]] !== p) { ok = false; break; }
    if (ok) return ls[k];
  }
  return -1;
}

/* =====================================================================
   ИИ: negamax + альфа-бета + таблица транспозиций + итеративное углубление
   ===================================================================== */
let deadline = 0, aborted = false, nodes = 0;
const TT = new Map();

function evaluate(me) {
  const W = CONFIG.weights;
  let s = 0;
  for (let li = 0; li < lines.length; li++) {
    const ln = lines[li];
    let a = 0, b = 0;
    for (let k = 0; k < ln.length; k++) {
      const v = cells[ln[k]];
      if (v === me) a++; else if (v !== 0) b++;
    }
    if (a && b) continue;
    if (a) s += W[a]; else if (b) s -= W[b];
  }
  return s;
}

function genMoves(side, jitter) {
  const total = N * N;
  let any = false;
  for (let i = 0; i < total; i++) if (cells[i]) { any = true; break; }
  const res = [];
  for (let i = 0; i < total; i++) {
    if (cells[i]) continue;
    if (N > 3) {
      if (any) {
        let near = false;
        const nb = neigh[i];
        for (let k = 0; k < nb.length; k++) if (cells[nb[k]]) { near = true; break; }
        if (!near) continue;
      } else if (!centerSet.has(i)) continue;
    }
    res.push(i);
  }
  const W = CONFIG.weights, opp = 3 - side;
  const sc = new Float64Array(res.length);
  for (let m = 0; m < res.length; m++) {
    const i = res[m];
    let s = centerSet.has(i) ? 0.5 : 0;
    const ls = cellLines[i];
    for (let k = 0; k < ls.length; k++) {
      const ln = lines[ls[k]];
      let a = 0, b = 0;
      for (let j = 0; j < ln.length; j++) {
        const v = cells[ln[j]];
        if (v === side) a++; else if (v === opp) b++;
      }
      if (!b) s += W[a + 1];
      if (!a) s += W[b + 1] * 0.9;
    }
    sc[m] = s + (jitter ? Math.random() * jitter : 0);
  }
  const idx = res.map((_, k) => k).sort((x, y) => sc[y] - sc[x]);
  return idx.map((k) => res[k]);
}

function keyOf(side) {
  let k = side + ':';
  for (let i = 0; i < cells.length; i++) k += cells[i];
  if (VANISH) k += '|' + queues[1].join(',') + '|' + queues[2].join(',');
  return k;
}

function search(depth, alpha, beta, side, ply) {
  if ((++nodes & 511) === 0 && performance.now() > deadline) aborted = true;
  if (aborted) return 0;
  if (VANISH && moveCount + ply >= CONFIG.vanishMaxMoves) return 0;
  if (depth === 0) return evaluate(side);

  const key = keyOf(side);
  const e = TT.get(key);
  let ttMove = -1;
  if (e) {
    if (e.d >= depth) {
      if (e.f === 0) return e.s;
      if (e.f === 1 && e.s >= beta) return e.s;
      if (e.f === 2 && e.s <= alpha) return e.s;
    }
    ttMove = e.m;
  }
  const moves = genMoves(side, 0);
  if (!moves.length) return 0; // поле заполнено — ничья
  if (ttMove >= 0) {
    const pos = moves.indexOf(ttMove);
    if (pos > 0) { moves.splice(pos, 1); moves.unshift(ttMove); }
  }
  const a0 = alpha, opp = 3 - side;
  let best = -INF, bm = moves[0];
  for (let k = 0; k < moves.length; k++) {
    const m = moves[k];
    const rem = apply(m, side);
    let s;
    if (winAt(m, side) >= 0) s = WIN - ply;
    else s = -search(depth - 1, -beta, -alpha, opp, ply + 1);
    undo(m, side, rem);
    if (aborted) return 0;
    if (s > best) { best = s; bm = m; }
    if (s > alpha) alpha = s;
    if (alpha >= beta) break;
  }
  if (TT.size > 300000) TT.clear();
  TT.set(key, { d: depth, s: best, f: best <= a0 ? 2 : best >= beta ? 1 : 0, m: bm });
  return best;
}

function aiChoose() {
  const lvl = LEVEL;
  let order = genMoves(AI, 0.5);
  if (order.length === 1) return order[0];
  if (Math.random() < lvl.blunder) return order[(Math.random() * order.length) | 0];

  TT.clear(); nodes = 0; aborted = false;
  deadline = performance.now() + lvl.time;
  const fullWindow = lvl.noise > 0;
  let empty = 0;
  for (let i = 0; i < cells.length; i++) if (!cells[i]) empty++;

  let final = null;
  for (let d = 1; d <= lvl.depth; d++) {
    const sc = new Array(order.length);
    let alpha = -INF;
    for (let k = 0; k < order.length; k++) {
      const m = order[k];
      const rem = apply(m, AI);
      let s;
      if (winAt(m, AI) >= 0) s = WIN;
      else s = -search(d - 1, -INF, fullWindow ? INF : -alpha, P, 1);
      undo(m, AI, rem);
      if (aborted) break;
      sc[k] = s;
      if (s > alpha) alpha = s;
    }
    if (aborted) break;
    const idx = order.map((_, k) => k).sort((x, y) => sc[y] - sc[x]);
    order = idx.map((k) => order[k]);
    final = idx.map((k) => sc[k]);
    if (Math.abs(final[0]) >= WIN - 100) break;       // найден форсированный исход
    if (!VANISH && d >= empty) break;                  // дерево просчитано до конца
  }
  if (!final) return order[0];
  if (lvl.noise > 0) {
    let bi = 0, bv = -INF;
    for (let k = 0; k < order.length; k++) {
      const v = final[k] + (Math.abs(final[k]) >= WIN - 100 ? 0 : Math.random() * lvl.noise);
      if (v > bv) { bv = v; bi = k; }
    }
    return order[bi];
  }
  return order[0];
}

function rankInfo(score) {

function updateDensity() {

  document.body.classList.toggle('h-short', avail <= 720);
  document.body.classList.toggle('h-xshort', avail <= 620);
}

function buildBoard() {

    b.dataset.i = i;
    b.setAttribute('role', 'gridcell');
    b.setAttribute('aria-label', t('cellAria', { r: Math.floor(i / N) + 1, c: i % N + 1 }));
    b.addEventListener('pointerdown', onCellPointer);
    el.board.appendChild(b);
    cellEls.push(b);
  }
}
function renderCell(i) {
  const b = cellEls[i], v = cells[i];
  b.classList.remove('x', 'o', 'old', 'gone', 'win');
  if (v === P) { b.classList.add('x'); b.innerHTML = SVG_X; }
  else if (v === AI) { b.classList.add('o'); b.innerHTML = SVG_O; }
  else b.innerHTML = '';
}
function animateRemoval(i) {
  const b = cellEls[i], id = gameId;
  b.classList.remove('old');
  b.classList.add('gone');
  setTimeout(() => { if (id === gameId && cells[i] === 0) renderCell(i); }, 230);
}
function refreshOld() {
  for (let i = 0; i < cellEls.length; i++) cellEls[i].classList.remove('old');
  if (!VANISH) return;
  for (const p of [P, AI]) {
    if (queues[p].length >= KEEP) cellEls[queues[p][0]].classList.add('old');
  }
}
function clearWinLine() {
  el.winLine.setAttribute('class', '');
  lastWin = { li: -1, who: 0 };
}
function drawWinLine(li, who, animate) {
  const ln = lines[li];
  const a = cellEls[ln[0]], b = cellEls[ln[ln.length - 1]];
  const W = el.wrap.clientWidth, H = el.wrap.clientHeight;
  el.winSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let x1 = a.offsetLeft + a.offsetWidth / 2, y1 = a.offsetTop + a.offsetHeight / 2;
  let x2 = b.offsetLeft + b.offsetWidth / 2, y2 = b.offsetTop + b.offsetHeight / 2;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const ext = a.offsetWidth * 0.3, ux = dx / len, uy = dy / len;
  x1 -= ux * ext; y1 -= uy * ext; x2 += ux * ext; y2 += uy * ext;
  const L_ = el.winLine;
  L_.setAttribute('x1', x1); L_.setAttribute('y1', y1);
  L_.setAttribute('x2', x2); L_.setAttribute('y2', y2);
  L_.setAttribute('stroke-width', Math.max(4, a.offsetWidth * 0.1));
  L_.setAttribute('class', '');
  if (animate) void L_.getBoundingClientRect();
  L_.setAttribute('class', `show ${who === P ? 'x' : 'o'}${animate ? ' draw' : ''}`);
  lastWin = { li, who };
}

/* ---------- HUD ---------- */
function status(text, who) {
  el.status.textContent = text;
  el.status.className = 'status' + (who === P ? ' you' : who === AI ? ' ai' : '');
}
function updateHud() {
  el.pYou.classList.toggle('active', state === 'playing' && turn === P);
  el.pAi.classList.toggle('active', state === 'playing' && turn === AI);
  if (VANISH) {
    el.pYouMeta.textContent = t('marks', { n: queues[P].length, k: KEEP });
    el.pAiMeta.textContent = t('marks', { n: queues[AI].length, k: KEEP });
  } else {
    el.pYouMeta.textContent = starter === P ? t('first') : t('second');
    el.pAiMeta.textContent = FRIEND ? (starter === AI ? t('first') : t('second')) : levelName(save.settings.level);
  }
}
function renderSoundBtn() {
  const html = save.sound
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  document.querySelectorAll('.sound-toggle').forEach((b) => {
    b.innerHTML = html;
    b.setAttribute('aria-label', save.sound ? t('soundOff') : t('soundOn'));
  });
}

/* ---------- Ход ---------- */
function snapshot() {
  history.push({
    cells: Int8Array.from(cells),
    q1: queues[1].slice(), q2: queues[2].slice(),
    moveCount, turn,
  });
  if (history.length > 80) history.shift();
}
function restore(sn) {
  cells.set(sn.cells);
  queues[1] = sn.q1.slice(); queues[2] = sn.q2.slice();
  moveCount = sn.moveCount; turn = sn.turn;
  for (let i = 0; i < cellEls.length; i++) renderCell(i);
  refreshOld();
}
// Отменяет последний ход человека вместе с ответом компьютера
function undoMove() {
  if (state !== 'playing' || aiBusy || undosLeft <= 0) return;
  let idx = -1;
  for (let k = history.length - 1; k >= 0; k--) {
    if (FRIEND || history[k].turn === P) { idx = k; break; }
  }
  if (idx < 0) return;
  restore(history[idx]);
  history.length = idx;
  undosLeft--;
  usedUndo = true;
  clearWinLine();
  el.wrap.classList.remove('ended');
  Sound.vanish(); buzz(12);
  renderUndo();
  updateHud();
  promptTurn();
}
function renderUndo() {
  const canUndo = undosLeft > 0 && history.some((h) => FRIEND || h.turn === P);
  const b = $('undoBtn');
  b.hidden = !canUndo || state !== 'playing';
  $('undoLabel').textContent = CONFIG.undoPerRound > 1
    ? t('undoN', { n: undosLeft })
    : t('undo');
}

function startRound() {
  gameId++;
  aiBusy = false; pendingAI = -1;
  const s = save.settings;
  VANISH = s.mode === 'vanish';
  LEVEL = CONFIG.levels[s.level];
  FRIEND = s.opponent === 'friend';
  setupGeometry(s.size);
  queues[1] = []; queues[2] = [];
  moveCount = 0; turn = starter;
  history.length = 0; undosLeft = CONFIG.undoPerRound; usedUndo = false;
  setState('playing');
  buildBoard();
  clearWinLine();
  renderTitle();
  $('pYouName').textContent = FRIEND ? t('xName') : t('you');
  $('pAiName').textContent = FRIEND ? t('oName') : t('ai');
  el.hint.textContent = VANISH
    ? t('hintVanish', { k: KEEP })
    : t('hintClassic', { l: L });
  updateHud();
  renderUndo();
  requestAnimationFrame(fitBoard);   // после отрисовки шапки и подсказки
  promptTurn();
}

function renderTitle() {
  el.title.textContent = FRIEND
    ? t('titleFriend', { n: N, a: tally[1], b: tally[2] })
    : t('titleAi', { n: N, level: levelName(save.settings.level) });
}

// Передаёт ход: ИИ считает сам, человеку показываем, чей ход
function promptTurn() {
  if (FRIEND) status(turn === P ? t('turnX') : t('turnO'), turn);
  else if (turn === AI) aiTurn();
  else status(t('yourTurn'), P);
}

function doMove(i, p) {
  snapshot();
  const rem = apply(i, p);
  moveCount++;
  renderCell(i);
  if (rem >= 0) animateRemoval(rem);
  refreshOld();
  if (p === P) Sound.x(); else Sound.o();
  if (rem >= 0) Sound.vanish();
  buzz(8);

  const li = winAt(i, p);
  if (li >= 0) return endRound(p, li);
  if (!VANISH && moveCount >= N * N) return endRound(0, -1);
  if (VANISH && moveCount >= CONFIG.vanishMaxMoves) return endRound(0, -1);

  turn = 3 - p;
  updateHud();
  renderUndo();
  promptTurn();
}

function aiTurn() {
  aiBusy = true;
  status(t('aiThinking'), AI);
  const id = gameId, t0 = performance.now();
  // короткая задержка — чтобы статус успел отрисоваться до расчёта
  setTimeout(() => {
    if (id !== gameId) return;
    const m = aiChoose();
    const wait = Math.max(0, CONFIG.aiMinDelay - (performance.now() - t0));
    setTimeout(() => {
      if (id !== gameId) return;
      if (state === 'paused') { pendingAI = m; return; }
      if (state !== 'playing') return;
      aiBusy = false;
      doMove(m, AI);
    }, wait);
  }, 60);
}

function playerTap(i) {
  if (state !== 'playing' || aiBusy || (turn !== P && !FRIEND)) return;
  if (cells[i]) {
    const b = cellEls[i];
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    Sound.bad();
    return;
  }
  doMove(i, turn);
}

function onCellPointer(e) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  Sound.unlock();
  playerTap(Number(e.currentTarget.dataset.i));
}

/* ---------- Итог раунда ---------- */
function endRound(w, li) {
  setState('gameover');
  aiBusy = false;
  $('undoBtn').hidden = true;
  updateHud();
  const id = gameId;
  if (FRIEND) return endFriendRound(w, li, id);
  const s = save.settings;
  const key = statKey();
  const st = save.stats[key] || (save.stats[key] = { w: 0, d: 0, l: 0 });
  const prevRank = rankInfo(save.score).i;
  const prevStreak = save.streak;
  const m = multOf();
  let reward = 0;

  const dTask = Daily.sync();
  const dailyHit = w === P && !save.daily.done && Daily.matches(dTask) && !usedUndo;

  if (w === P) {
    reward = Math.round(CONFIG.reward.win * m * (1 + streakBonus()));
    if (dailyHit) { reward *= CONFIG.daily.bonus; save.daily.done = true; }
    save.streak++;
    save.bestStreak = Math.max(save.bestStreak, save.streak);
    st.w++;
    status(t('win'), P);
    Sound.win(); buzz([20, 40, 20]);
  } else if (w === AI) {
    save.streak = 0;
    st.l++;
    status(t('lose'), AI);
    Sound.lose(); buzz(60);
  } else {
    reward = Math.round(CONFIG.reward.draw * m);
    st.d++;
    status(t('draw'));
    Sound.draw();
  }
  save.score += reward;
  Store.save(save);

  if (li >= 0) {
    const ln = lines[li];
    el.wrap.classList.add('ended');
    for (const i of ln) cellEls[i].classList.add('win');
    drawWinLine(li, w, true);
  }

  // итоговый экран
  const title = $('overTitle');
  title.className = w === P ? 'win' : w === AI ? 'lose' : '';
  title.textContent = w === P ? t('win') : w === AI ? t('lose') : t('draw');
  $('overSub').textContent =
    w === P ? t('subWin', { l: L })
    : w === AI ? (s.level === CONFIG.levels.length - 1 ? t('subLegend') : t('subLose'))
    : VANISH ? t('subDrawV', { n: CONFIG.vanishMaxMoves }) : t('subDrawC');
  const rw = $('overReward');
  rw.textContent = '+' + fmt(reward);
  rw.classList.toggle('zero', reward === 0);
  $('overTotal').textContent = t('total', { s: tp(save.score, 'pts'), pts: '' }).trim();
  $('overStreak').textContent =
    w === P ? t('streakWin', { n: save.streak })
    : (w === AI && prevStreak > 0) ? t('streakBroken', { n: prevStreak })
    : save.streak > 0 ? t('streakKept', { n: save.streak }) : '';
  const newRank = rankInfo(save.score);
  const news = $('overNews');
  if (dailyHit) { news.hidden = false; news.textContent = t('dailyHit', { b: CONFIG.daily.bonus }); }
  else if (newRank.i > prevRank) { news.hidden = false; news.textContent = t('newRank', { r: rankName(newRank.i) }); }
  else news.hidden = true;
  $('overNextStarter').textContent = starter === P ? t('nextAi') : t('nextYou');

  setTimeout(() => {
    if (id !== gameId || state !== 'gameover') return;
    el.overOv.classList.add('show');
    $('againBtn').focus({ preventScroll: true });
  }, li >= 0 ? CONFIG.endDelay : 500);
}

// Итог игры вдвоём: без очков и статистики, только счёт встречи
function endFriendRound(w, li, id) {
  if (w) tally[w]++; else tally.d++;
  renderTitle();
  if (w) { status(w === P ? t('fWinX') : t('fWinO'), w); Sound.win(); buzz([20, 40, 20]); }
  else { status(t('draw')); Sound.draw(); }
  if (li >= 0) {
    el.wrap.classList.add('ended');
    for (const i of lines[li]) cellEls[i].classList.add('win');
    drawWinLine(li, w, true);
  }
  const title = $('overTitle');
  title.className = w === P ? 'win' : w === AI ? 'lose' : '';
  title.textContent = w === P ? t('fTitleX') : w === AI ? t('fTitleO') : t('draw');
  $('overSub').textContent = w
    ? t('fSub', { l: L })
    : VANISH ? t('subDrawV', { n: CONFIG.vanishMaxMoves }) : t('subDrawC');
  const rw = $('overReward');
  rw.textContent = `${tally[1]} : ${tally[2]}`;
  rw.classList.remove('zero');
  $('overTotal').textContent = t('fScore');
  $('overStreak').textContent = tally.d ? t('fDraws', { n: tally.d }) : '';
  $('overNews').hidden = true;
  $('overNextStarter').textContent = starter === P ? t('fNextO') : t('fNextX');
  setTimeout(() => {
    if (id !== gameId || state !== 'gameover') return;
    el.overOv.classList.add('show');
    $('againBtn').focus({ preventScroll: true });
  }, li >= 0 ? CONFIG.endDelay : 500);
}

/* ---------- Пауза / выход ---------- */
function pause() {
  if (state !== 'playing') return;
  $('pauseNote').textContent = !FRIEND && save.streak > 0 && moveCount > 0
    ? t('pauseStreak', { n: save.streak })
    : t('pauseWait');
  setState('paused');
  updateHud();
  $('resumeBtn').focus({ preventScroll: true });
}
function resume() {
  if (state !== 'paused') return;
  setState('playing');
  updateHud();
  renderUndo();
  if (pendingAI >= 0) {
    const m = pendingAI;
    pendingAI = -1; aiBusy = false;
    doMove(m, AI);
  } else if (FRIEND || turn === P) promptTurn();
}
function abandonIfStarted() {
  if (!FRIEND && (state === 'playing' || state === 'paused') && moveCount > 0 && save.streak > 0) {
    save.streak = 0;
    Store.save(save);
  }
}
function toMenu() {
  abandonIfStarted();
  gameId++;
  aiBusy = false; pendingAI = -1;
  starter = P;
  setState('menu');
}

/* =====================================================================
   Ввод
   ===================================================================== */
document.querySelectorAll('#modeSeg button').forEach((b) => b.addEventListener('click', () => {
  Sound.unlock(); Sound.tap();
  save.settings.mode = b.dataset.mode; Store.save(save); renderMenu();
}));
document.querySelectorAll('#sizeSeg button').forEach((b) => b.addEventListener('click', () => {
  Sound.unlock(); Sound.tap();
  save.settings.size = Number(b.dataset.size); Store.save(save); renderMenu();
}));
$('lvlPrev').addEventListener('click', () => {
  if (save.settings.level > 0) { Sound.unlock(); Sound.tap(); save.settings.level--; Store.save(save); renderMenu(); }
});
$('lvlNext').addEventListener('click', () => {
  if (save.settings.level < CONFIG.levels.length - 1) { Sound.unlock(); Sound.tap(); save.settings.level++; Store.save(save); renderMenu(); }
});
$('undoBtn').addEventListener('click', () => { Sound.unlock(); undoMove(); });
$('langBtn').addEventListener('click', () => {
  Sound.unlock(); Sound.tap();
  LANG = LANG === 'ru' ? 'en' : 'ru';
  save.lang = LANG; Store.save(save);
  applyStatic(); renderSoundBtn(); renderMenu();
});
$('dailyCard').addEventListener('click', () => {
  Sound.unlock(); Sound.tap();
  const dTask = Daily.sync();
  save.settings.opponent = 'ai';
  save.settings.size = dTask.size;
  save.settings.mode = dTask.mode;
  save.settings.level = dTask.level;
  Store.save(save);
  renderMenu();
});
$('playBtn').addEventListener('click', () => {
  Sound.unlock(); Sound.tap();
  starter = P; tally[1] = 0; tally[2] = 0; tally.d = 0;
  startRound();
});
document.querySelectorAll('#oppSeg button').forEach((b) => b.addEventListener('click', () => {
  Sound.unlock(); Sound.tap();
  save.settings.opponent = b.dataset.opp; Store.save(save); renderMenu();
}));
$('menuBtn').addEventListener('click', () => { Sound.tap(); if (state === 'playing' && moveCount > 0) pause(); else toMenu(); });
$('pauseBtn').addEventListener('click', () => { Sound.tap(); pause(); });
$('resumeBtn').addEventListener('click', () => { Sound.tap(); resume(); });
$('restartBtn').addEventListener('click', () => { Sound.tap(); abandonIfStarted(); startRound(); });
$('quitBtn').addEventListener('click', () => { Sound.tap(); toMenu(); });
$('againBtn').addEventListener('click', () => { Sound.tap(); starter = 3 - starter; startRound(); });
$('toMenuBtn').addEventListener('click', () => { Sound.tap(); toMenu(); });
document.querySelectorAll('.sound-toggle').forEach((b) => b.addEventListener('click', () => {
  save.sound = !save.sound; Store.save(save); renderSoundBtn();
  if (save.sound) { Sound.unlock(); Sound.tap(); }
}));

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state === 'playing') { e.preventDefault(); pause(); }
    else if (state === 'paused') { e.preventDefault(); resume(); }
    return;
  }
  if (state !== 'playing') return;
  const active = document.activeElement;
  const cur = cellEls.indexOf(active);
  const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (arrows[e.key]) {
    e.preventDefault();
    let i = cur;
    if (i < 0) i = Math.floor(N / 2) * N + Math.floor(N / 2);
    else {
      const r = Math.min(N - 1, Math.max(0, Math.floor(i / N) + arrows[e.key][0]));
      const c = Math.min(N - 1, Math.max(0, i % N + arrows[e.key][1]));
      i = r * N + c;
    }
    cellEls[i].focus();
  } else if ((e.key === 'Enter' || e.key === ' ') && cur >= 0) {
    e.preventDefault();
    Sound.unlock();
    playerTap(cur);
  } else if (N === 3 && /^[1-9]$/.test(e.key)) {
    // цифры 1–9 как на нампаде: 7 8 9 — верхний ряд
    const k = Number(e.key);
    const r = 2 - Math.floor((k - 1) / 3), c = (k - 1) % 3;
    Sound.unlock();
    playerTap(r * 3 + c);
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) pause();
  Rain.toggle(!document.hidden);
});
window.addEventListener('resize', () => {
  if (lastWin.li >= 0 && cellEls.length) drawWinLine(lastWin.li, lastWin.who, false);
});

/* =====================================================================
   Старт
   ===================================================================== */
LANG = detectLang();
applyStatic();
renderSoundBtn();
setState('menu');
(async () => {
  // мост ждём с ограничением: если SDK не ответит, играем как обычная страница
  await withTimeout(gemBridge.init(), 1200, null);
  const d = await Store.load();
  save = sanitize(d);
  Store.ready = true;
  LANG = save.lang;
  applyStatic();
  renderSoundBtn();
  if (state === 'menu') renderMenu();
  // интерфейс отрисован — сообщаем платформе, что мини-апп готов
  gemBridge.ready();
})();
})();
</script>
</body>
</html>
